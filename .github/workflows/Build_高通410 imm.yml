#
#

name: 🚀 编译 MF32T 固件（ImmortalWrt 高通410）

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: ' ← 开启 SSH 调试（专业人员使用）'
        required: false
        default: false
        type: boolean
      profile:
        description: ' ↓ 编译机型（仅支持 MF32T）↓ '
        type: choice
        options:
          - mf32
        default: mf32
        required: true
      upstream:
        description: ' ↓ 选择上游源码仓库 ↓ '
        type: choice
        options:
          - lkiuyu/immortalwrt
        default: lkiuyu/immortalwrt
        required: true
      custom_hash:
        description: ' ↓ 指定 hash（默认留空用锁定版本）↓ '
        required: false
        default: ''
        type: string
      extra_packages:
        description: ' ↓ 额外软件包（逗号/空格分隔；支持 __ip__ 与 __hostname__ 特殊参数）↓ '
        required: false
        default: ''
        type: string

env:
  REPO_URL: https://github.com/${{ github.event.inputs.upstream }}
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: ${{ format('config/{0}.config', github.event.inputs.profile) }}
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

# 并发控制：同一分支同时只跑一个构建，新触发自动取消旧的（节省 Actions 配额）
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: write
    steps:
    - name: 🚀 检出仓库代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: 🖥️ 显示硬件信息
      run: |
        chmod 755 ./scripts/show_hardware_info.sh
        ./scripts/show_hardware_info.sh

    - name: 🔧 增大 Git 缓冲（避免大仓库推送失败）
      run: git config --global http.postBuffer 524288000

    - name: 🧹 释放磁盘空间（Ubuntu）
      run: |
        echo "==> 清理前磁盘空间："
        df -hT /
        # 直接 rm 不需要的大型预装软件（替代失效的 jlumbroso/free-disk-space）
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /opt/hostedtoolcache \
          /usr/local/lib/heroku \
          /usr/local/share/boost \
          /usr/share/swift \
          /usr/local/miniconda \
          /usr/local/miniforge \
          /usr/local/aws-cli \
          /usr/local/aws-sam-cli \
          /usr/local/julia* \
          2>/dev/null || true
        # 卸载 OpenWrt 编译不需要的桌面/云工具
        sudo apt-get remove -y --purge snapd google-chrome-stable firefox microsoft-edge-stable powershell 2>/dev/null || true
        sudo apt-get autoremove -y --purge 2>/dev/null || true
        # 清理 JVM / Go / Rust 等编译无关的工具链（OpenWrt 用自带的 toolchain）
        sudo rm -rf \
          /usr/lib/jvm \
          /usr/local/go \
          /usr/local/.ghcup \
          /root/.cargo \
          /usr/local/lib/node_modules \
          2>/dev/null || true
        # 重置 4G swap（保证大编译时内存吃紧时不爆）
        sudo swapoff -a 2>/dev/null || true
        sudo rm -f /swapfile 2>/dev/null
        sudo fallocate -l 4G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile 2>/dev/null || true
        sudo swapon /swapfile 2>/dev/null || true
        echo "==> 清理后磁盘空间："
        df -hT /

    - name: ⚙️ 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -y update
        sudo -E apt-get -y install $(curl -fsSL https://raw.githubusercontent.com/xuxin1955/depend_ubuntu2204_openwrt/refs/heads/main/depend_ubuntu2204_openwrt)
        sudo timedatectl set-timezone "$TZ"

    - name: 🛠️ 安装 mkbootimg（boot 镜像打包工具）
      run: |
        wget https://github.com/xuxin1955/depend_ubuntu2204_openwrt/releases/download/ubuntu_26.04_LTS_mkbootimg/mkbootimg_34.0.5-12build1_all.deb
        sudo dpkg -i mkbootimg_34.0.5-12build1_all.deb
        sudo apt-get install -f -y
        # 验证安装
        mkbootimg --help || true
        MKBOOTIMG_PATH=$(which mkbootimg)
        if [ -n "$MKBOOTIMG_PATH" ]; then
          echo "mkbootimg found at: $MKBOOTIMG_PATH"
          file "$MKBOOTIMG_PATH"
        else
          echo "❌ mkbootimg not found in PATH!"
        fi
        sudo chmod 777 /mnt
        df -hT

    - name: 🐍 准备 Python 构建工具
      run: |
        python3 -m pip cache purge
        python3 -m pip install --upgrade --force-reinstall pip
        python3 -m pip install --upgrade --force-reinstall 'setuptools>=65' wheel
        python3 -m pip install --upgrade 'setuptools-scm>=8,<10'
        python3 -m pip install --upgrade cython packaging tomli
        python3 -m pip install Unidecode pyelftools
        python3 -m pip --version
        python3 -c "import setuptools.build_meta; print('setuptools.build_meta OK')"

    - name: 📌 读取锁定的上游 hash
      id: lock
      run: |
        CUSTOM_HASH="${{ github.event.inputs.custom_hash }}"
        LOCK_FILE="upstream_lock.txt"
        if [ -n "$CUSTOM_HASH" ]; then
          echo "locked_hash=$CUSTOM_HASH" >> $GITHUB_OUTPUT
          echo "使用用户指定 hash: $CUSTOM_HASH"
        elif [ -f "$LOCK_FILE" ]; then
          HASH=$(cat $LOCK_FILE)
          echo "locked_hash=$HASH" >> $GITHUB_OUTPUT
          echo "使用锁定 hash: $HASH"
        else
          echo "locked_hash=" >> $GITHUB_OUTPUT
          echo "upstream_lock.txt 不存在，使用最新 master"
        fi

    - name: 📥 克隆上游源码
      working-directory: /mnt
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        if [ -n "${{ steps.lock.outputs.locked_hash }}" ]; then
          cd openwrt && git checkout ${{ steps.lock.outputs.locked_hash }}
        fi
        ln -sf /mnt/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 💾 恢复 dl 下载缓存（同 hash 重复编译可跳过下载）
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: dl-${{ steps.lock.outputs.locked_hash }}-${{ hashFiles('diy-part1.sh', 'diy-part2.sh', 'feeds.conf.default', 'config/mf32.config') }}
        restore-keys: |
          dl-${{ steps.lock.outputs.locked_hash }}-
          dl-

    - name: 📡 加载自定义 feeds（diy-part1）
      run: |
        [ -e "$FEEDS_CONF" ] && mv "$FEEDS_CONF" openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 🔄 更新 feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: 🧹 清理与系统冲突的软件包（smpackage）
      run: |
        # 删除 small-package 中与系统冲突的包，避免编译报错（官方推荐操作）
        rm -rf openwrt/feeds/smpackage/{base-files,dnsmasq,firewall*,fullconenat,libnftnl,nftables,ppp,opkg,ucl,upx,vsftpd*,miniupnpd-iptables,wireless-regdb}

    - name: 🔗 安装 feeds
      run: cd openwrt && ./scripts/feeds install -a -f

    - name: 📝 加载自定义配置（diy-part2）
      run: |
        # files 覆盖目录在此一次性就位（勿重复 cp/mv，否则会嵌套成 openwrt/files/files 混入固件）
        [ -e files ] && mv files openwrt/files
        [ -e "$CONFIG_FILE" ] && mv "$CONFIG_FILE" openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 📦 安装额外软件包
      if: ${{ inputs.extra_packages != '' }}
      run: |
        cd openwrt
        echo "=========================================="
        echo "User requested extra packages:"
        echo "${{ inputs.extra_packages }}"
        echo "=========================================="
        RAW='${{ inputs.extra_packages }}'
        CUSTOM_IP=$(echo "$RAW" | grep -oP '(?<=__ip__)[^,\s]+' || true)
        CUSTOM_HOSTNAME=$(echo "$RAW" | grep -oP '(?<=__hostname__)[^,\s]+' || true)
        if [ -n "$CUSTOM_IP" ]; then
          echo "🌐 设置管理 IP: $CUSTOM_IP"
          sed -i "s/192\.168\.10\.1/$CUSTOM_IP/g" package/base-files/files/bin/config_generate
        fi
        if [ -n "$CUSTOM_HOSTNAME" ]; then
          echo "🏷️ 设置主机名: $CUSTOM_HOSTNAME"
          sed -i "s/set system\.@system\[0\]\.hostname='ImmortalWrt'/set system.@system[0].hostname='$CUSTOM_HOSTNAME'/" package/base-files/files/bin/config_generate || true
          sed -i "s/option hostname 'ImmortalWrt'/option hostname '$CUSTOM_HOSTNAME'/" package/base-files/files/etc/config/system 2>/dev/null || true
        fi
        PACKAGES=$(echo "$RAW" | sed 's/,/ /g' | tr ' ' '\n' | grep -v '^__ip__' | grep -v '^__hostname__' | tr '\n' ' ')
        if echo "$PACKAGES" | grep -qw "luci-app-turboacc"; then
          echo "⚡ 检测到 luci-app-turboacc，执行 turboacc 安装脚本..."
          curl -sSL https://raw.githubusercontent.com/mufeng05/turboacc/main/add_turboacc.sh -o add_turboacc.sh && bash add_turboacc.sh || echo "⚠️ turboacc 脚本执行失败，跳过"
        fi
        for pkg in $PACKAGES; do
          if [ -n "$pkg" ]; then
            CFG="CONFIG_PACKAGE_${pkg}"
            if grep -q "^# ${CFG} is not set" .config; then
              sed -i "s/^# ${CFG} is not set$/${CFG}=y/" .config
              echo "✅ Enabled (replaced): ${CFG}=y"
            elif grep -q "^${CFG}=" .config; then
              sed -i "s/^${CFG}=.*$/${CFG}=y/" .config
              echo "✅ Enabled (updated): ${CFG}=y"
            else
              echo "${CFG}=y" >> .config
              echo "✅ Enabled (appended): ${CFG}=y"
            fi
          fi
        done

    - name: 🛠️ SSH 调试（无人连接 30 分钟自动继续；连接后输入 q 再 exit 退出）
      uses: mxschmitt/action-tmate@v3
      if: ${{ inputs.ssh || contains(github.event.action, 'ssh') }}
      timeout-minutes: 30

    - name: 🧩 生成 defconfig 配置
      id: config
      run: |
        cd openwrt
        make defconfig

    - name: ⬇️ 下载软件包源码
      id: package
      run: |
        cd openwrt
        make download -j$(nproc) V=s
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 📂 检查 openwrt 目录与配置
      run: |
        ls -la openwrt/
        ls -la openwrt/.config

    - name: 📤 上传生成的 .config 编译配置
      uses: actions/upload-artifact@v4
      with:
        name: build-config
        path: |
          ${{ github.workspace }}/openwrt/.config
          ${{ github.workspace }}/openwrt/feeds.conf.default
        include-hidden-files: true

    - name: 🔨 编译固件
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        if make -j$(nproc) V=s; then
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "::error::首次并行编译失败，尝试单线程重编译..."
          if make -j1 V=s; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
        fi
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: 🏷️ 获取内核版本
      if: steps.compile.outputs.status == 'success'
      run: |
        KERNEL_VER=$(cat /mnt/openwrt/build_dir/target-*/linux-*/linux-*/.kernelversion 2>/dev/null | head -1 || echo "未知")
        echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_ENV

    - name: 💾 检查磁盘空间
      if: (!cancelled())
      run: df -hT

    - name: 📦 上传 bin 目录
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: 📁 整理固件文件（生成刷机包）
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        PROFILE=${{ github.event.inputs.profile }}
        mkdir -p flash_package
        BOOT_IMG=$(ls boot.img.gz 2>/dev/null || ls *boot.img 2>/dev/null | head -1)
        SYSTEM_IMG=$(ls system.img.gz 2>/dev/null || ls *system.img 2>/dev/null | head -1)
        if [ -z "$BOOT_IMG" ] || [ -z "$SYSTEM_IMG" ]; then
          echo "::error::固件文件未找到，编译可能失败！当前目录文件："
          ls -la
          exit 1
        fi
        cp "$BOOT_IMG" flash_package/boot.img.gz
        cp "$SYSTEM_IMG" flash_package/system.img.gz
        gzip -dk flash_package/boot.img.gz
        gzip -dk flash_package/system.img.gz
        rm flash_package/boot.img.gz flash_package/system.img.gz
        cp -r "$GITHUB_WORKSPACE/刷机脚本/." flash_package/
        # 确保 bat 文件为 Windows 兼容的 CRLF 换行
        if command -v unix2dos >/dev/null 2>&1; then
          unix2dos flash_package/*.bat
        else
          sed -i 's/\r$//' flash_package/*.bat
          sed -i 's/$/\r/' flash_package/*.bat
        fi
        ZIP_NAME="OpenWrt_${PROFILE}_刷机包.zip"
        cd flash_package && zip -r "../$ZIP_NAME" . && cd ..
        mkdir -p release_files
        mv "$ZIP_NAME" release_files/
        cp *.manifest release_files/ 2>/dev/null || true
        cp *.buildinfo release_files/ 2>/dev/null || true
        cp sha256sums release_files/ 2>/dev/null || true
        echo "FIRMWARE=$PWD/release_files" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 📤 上传固件目录
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: 🏷️ 生成 Release 标签与说明
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
      run: |
        PROFILE=${{ github.event.inputs.profile }}
        RAW='${{ inputs.extra_packages }}'
        CUSTOM_IP=$(echo "$RAW" | grep -oP '(?<=__ip__)[^,\s]+' || true)
        CUSTOM_HOSTNAME=$(echo "$RAW" | grep -oP '(?<=__hostname__)[^,\s]+' || true)
        DISPLAY_IP=${CUSTOM_IP:-192.168.10.1}
        DISPLAY_HOSTNAME=${CUSTOM_HOSTNAME:-ImmortalWrt}
        EXTRA=$(echo "$RAW" | sed 's/,/ /g' | tr ' ' '\n' | grep -v '^__ip__' | grep -v '^__hostname__' | sed '/^$/d')
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")-${PROFILE}" >> $GITHUB_OUTPUT
        {
          echo "## ImmortalWrt 高通410系列 · ${PROFILE}"
          echo ""
          echo "| 项目 | 信息 |"
          echo "|------|------|"
          echo "| 编译者 | ${{ github.actor }} |"
          echo "| 机型 | ${PROFILE} |"
          echo "| 内核版本 | ${{ env.KERNEL_VER }} |"
          echo "| 管理地址 | ${DISPLAY_IP} |"
          echo "| 主机名 | ${DISPLAY_HOSTNAME} |"
          echo "| 默认用户 | root |"
          echo "| 默认密码 | 空 |"
          echo ""
          if [ -n "$EXTRA" ]; then
            echo "### 额外添加的包"
            echo "$EXTRA" | sed 's/^/- /'
          else
            echo "### 额外添加的包"
            echo "无"
          fi
        } >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 📋 生成文件清单
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
      run: |
        find ${{ env.FIRMWARE }} -type f > file_list.txt
        echo "Collected files:"
        cat file_list.txt
        test -s file_list.txt || { echo "::error::No firmware files found"; exit 1; }

    - name: 🚀 上传固件到 Release
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
      uses: ncipollo/release-action@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag: ${{ steps.tag.outputs.release_tag }}
        bodyFile: release.txt
        artifacts: ${{ env.FIRMWARE }}/**/*
        artifactErrorsFailBuild: false
        allowUpdates: true
        draft: false
        prerelease: false

    - name: 🧹 清理旧的 Workflow 运行记录（GitHub API）
      if: always()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RETAIN_DAYS: 7
        KEEP_MINIMUM_RUNS: 5
      run: |
        CUTOFF=$(date -d "-${RETAIN_DAYS} days" +%s)
        RUNS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100")
        DEL_IDS=$(echo "$RUNS" | jq -r --argjson cutoff "$CUTOFF" --argjson keep "$KEEP_MINIMUM_RUNS" '
          [.workflow_runs[]
            | select((.created_at | fromdateiso8601) < $cutoff)
            | {id, created_at}
          ]
          | sort_by(.created_at)
          | .[:-$keep]
          | .[].id
        ')
        if [ -z "$DEL_IDS" ]; then
          echo "没有需要删除的旧运行记录。"
        else
          echo "$DEL_IDS" | while read -r run_id; do
            [ -z "$run_id" ] && continue
            echo "删除运行记录 $run_id"
            curl -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id"
          done
        fi
