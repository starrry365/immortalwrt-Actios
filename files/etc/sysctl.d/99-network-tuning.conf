# ============================================================
# MF32 网络性能调优 (MSM8916 高通410 随身WiFi)
# 适用于蜂窝网络(4G/5G CPE) + NAT 转发场景
# 开机时由 /etc/sysctl.d/ 自动加载
# ============================================================

# --- 连接跟踪 (conntrack) 调优 ---
# 蜂窝网络下大量短连接/UDP 连接(视频、语音、IoT)，默认表太小会丢包断连
# 注: nf_conntrack_buckets 为模块加载参数, 在 /etc/modules.d/ 中配置
net.netfilter.nf_conntrack_max=65536
# 减少 conntrack 表锁竞争，提升 NAT 吞吐
net.netfilter.nf_conntrack_acct=0

# --- TCP 缓冲区调优 ---
# 提升弱网(高延迟蜂窝链路)下的 TCP 吞吐
net.ipv4.tcp_rmem=4096 87380 16777216
net.ipv4.tcp_wmem=4096 65536 16777216
net.ipv4.tcp_mem=65536 131072 262144
# 启用 TCP 窗口缩放，配合 BBR 获得更好弱网吞吐
net.ipv4.tcp_window_scaling=1
# 提高 TCP 时间戳精度与重传效率
net.ipv4.tcp_sack=1
net.ipv4.tcp_timestamps=1

# --- 连接与转发性能 ---
# 允许更多并发连接(游戏、P2P、下载)
net.core.somaxconn=1024
net.core.netdev_max_backlog=2048
# 默认 qdisc 由 rc.local 的 fq 管理；此处确保 socket 转发无损
net.core.rmem_max=16777216
net.core.wmem_max=16777216
net.core.rmem_default=262144
net.core.wmem_default=262144

# --- NAT/路由转发优化 ---
# 减少转发路径延迟 (无需等待邻居确认)
net.ipv4.conf.all.rp_filter=1
net.ipv4.conf.default.rp_filter=1
# 路由缓存调优(低内存设备使用默认即可，不额外增大)

# --- 本地地址/回环优化 ---
net.ipv4.ip_local_port_range=1024 65535

# --- 可用性保护 ---
# 防止 TCP 孤儿连接堆积导致 OOM
net.ipv4.tcp_max_orphans=16384
net.ipv4.tcp_fin_timeout=30
# 文件描述符上限 (OpenWrt 默认 16384，够用则不变)
# fs.file-max=32768

# --- IPv6 支持 (蜂窝网络常见 IPv6 隧道/直连) ---
net.ipv6.conf.all.accept_ra=2
net.ipv6.conf.default.accept_ra=2